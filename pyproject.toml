[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-llm-api-call-logger"
version = "1.1.2"
description = "Log every LLM API call with full request/response details for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
llm-api-call-logger = "llm_api_call_logger:register"

[project.urls]
Source = "https://github.com/nuffin/hermes-llm-api-call-logger-pip"

[tool.setuptools.packages.find]
include = ["llm_api_call_logger*"]
